[package]
name = "hive-p2p-node"
version = "0.3.0"
publish = false
edition = "2021"
description = "HIVE unified P2P node: peer discovery + NAT traversal + rule shard distribution"

[dependencies]
rete-alpha = { path = "../rete-alpha" }
libp2p = { version = "0.56", features = [
    # Discovery
    "kad",
    "identify",
    "mdns",
    # Transport
    "tcp",
    "quic",
    "noise",
    "yamux",
    # NAT traversal
    "autonat",
    "relay",
    "dcutr",
    # Pub/sub
    "gossipsub",
    # Request-response (Dandelion++)
    "request-response",
    # Utility
    "ping",
    "tokio",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
postcard = { version = "1.1", features = ["alloc"] }
zstd = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# NOTE: `[profile.release]` lives at workspace root (`/Cargo.toml`).
# Cargo ignores per-member profile blocks under a workspace; the
# opt-level/lto/codegen-units/strip settings are preserved there.
