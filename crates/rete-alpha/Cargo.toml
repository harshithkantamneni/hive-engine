[package]
name = "rete-alpha"
version = "0.1.0-alpha"
publish = false
edition = "2021"

[features]
default = []
live-extraction = ["tokio/process", "tokio/io-util", "tokio/rt"]

[dependencies]
slotmap = "1.0"
rustc-hash = "2.1"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
blake3 = "1.5"
postcard = { version = "1.1", features = ["alloc"] }
ratatui = "0.30"
crossterm = "0.28"
toml = "0.8"
rand_chacha = "0.9"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
notify = "6"
log = "0.4"
# Structured logging. tracing-subscriber pulls env-filter so
# RUST_LOG="hive=debug,rete_alpha=info" works the way operators expect;
# tracing-log routes existing `log::warn!` / `log::info!` calls into the
# tracing pipeline so we do not need a flag-day rewrite of every callsite.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
tracing-log = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
# Owned TempDir guards for jitter_queue persistence tests
# so parallel-test execution doesn't race on std::env::temp_dir() paths.
tempfile = "3"

[[bench]]
name = "wme_insertion"
harness = false

[[bin]]
name = "memory_test"
path = "src/bin/memory_test.rs"

[[bin]]
name = "jtms_bench"
path = "src/bin/jtms_bench.rs"

[[bin]]
name = "re3_quality_test"
path = "src/bin/re3_quality_test.rs"

[[bin]]
name = "re5_throughput"
path = "src/bin/re5_throughput.rs"

[[bin]]
name = "a3_pipeline_test"
path = "src/bin/a3_pipeline_test.rs"

[[bin]]
name = "hive_tui"
path = "src/bin/hive_tui.rs"

[[bin]]
name = "hive"
path = "src/bin/hive.rs"
