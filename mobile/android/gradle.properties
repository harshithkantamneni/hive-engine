# HIVE Android — gradle.properties
#
# Required by AGP 8.7.x for AndroidX namespace migration; without it the build
# fails with "android.useAndroidX property is not enabled". AGP-required
# infrastructure file.
#
# Settings rationale:
# - android.useAndroidX=true: required because build.gradle.kts deps use
#   androidx.* packages (core-ktx 1.13.1 + appcompat 1.7.0 + test runners).
# - android.nonTransitiveRClass=true: AGP 8+ default; explicit for clarity.
# - org.gradle.jvmargs: AGP 8.7+ recommends min 2GB heap for Kotlin compile.

android.useAndroidX=true
android.nonTransitiveRClass=true

# JVM heap for Gradle daemon — AGP 8.7+ minimum.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style — official Kotlin style guide.
kotlin.code.style=official
