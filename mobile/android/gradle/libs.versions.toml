# HIVE Android — Gradle Version Catalog (libs.versions.toml)
#
# Pins the toolchain (AGP / Kotlin / rust-android-gradle / NDK / CMake) and the
# AndroidX + Compose dependency versions consumed by build.gradle.kts.
#
# Version selection rationale:
#
# 1. agp = "8.7.3" — Android Gradle Plugin 8.7.3 (released 2024-12-09 per
#    https://developer.android.com/build/releases/gradle-plugin). 8.7.x is the
#    LTS-class line for compileSdk 35 / minSdk 31. AGP 9.x is not selected
#    because rust-android-gradle 0.9.6 has not been validated against AGP 9 in
#    its published changelog.
#
# 2. kotlin = "2.0.21" — Kotlin 2.0.21 (released 2024-10-10). Compatible with
#    AGP 8.7.x per the Kotlin/AGP compatibility matrix
#    (https://kotlinlang.org/docs/gradle-configure-project.html).
#
# 3. rust-android-gradle = "0.9.6" — mirrored from build.gradle.kts
#    (github.com/mozilla/rust-android-gradle/releases 2025-01-13).
#
# 4. ndk = "25.2.9519653" — NDK r25c. The bionic memset_explicit weak-link
#    mechanism is preserved across r25-r29, with lower spec-churn.
#    sdkmanager package id: ndk;25.2.9519653 (numeric SDK manager identifier).
#
# 5. cmake = "3.22.1" — Android-bundled CMake 3.22.1. Matches the CMakeLists.txt
#    minimum requirement.
#
# Applied in build.gradle.kts via the standard plugins{} + libs.* alias surface.
# This file is consumed by Gradle's version-catalog resolution.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
rust-android-gradle = "0.9.6"
ndk = "25.2.9519653"
cmake = "3.22.1"

# Android library versions (mirror of build.gradle.kts dependencies block).
androidx-core-ktx = "1.13.1"
androidx-appcompat = "1.7.0"
junit = "4.13.2"
androidx-test-ext-junit = "1.2.1"
androidx-test-espresso = "3.6.1"
androidx-test-runner = "1.6.1"
androidx-test-rules = "1.6.1"

# Compose surface for the LEDGER screen.
# kotlin = 2.0.21 (above) is the Kotlin Compose-Compiler bundled-plugin floor (Compose
# Compiler ships with Kotlin 2.0+ as `org.jetbrains.kotlin.plugin.compose`; no
# separate compose-compiler dep needed).
# androidx.compose:compose-bom 2024.10.01 is the LTS-class BOM matching AGP 8.7 / Kotlin 2.0.
# androidx.activity:activity-compose 1.9.3 is the ComponentActivity ↔ setContent bridge.
# androidx.lifecycle:lifecycle-{viewmodel,runtime}-compose 2.8.7 wires ViewModel +
# collectAsStateWithLifecycle.
# All deps are AndroidX (zero-telemetry; no Firebase, no Crashlytics, no GPS analytics).
androidx-activity-compose = "1.9.3"
androidx-compose-bom = "2024.10.01"
androidx-lifecycle = "2.8.7"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }

# Compose surface. BOM-pinned versions inherit from compose-bom.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
rust-android-gradle = { id = "org.mozilla.rust-android-gradle.rust-android", version.ref = "rust-android-gradle" }
